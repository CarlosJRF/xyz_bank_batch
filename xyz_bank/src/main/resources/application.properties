spring.application.name=demo

#Integrando base de datos postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/xyzbank
spring.datasource.username=postgres
spring.datasource.password=c1j9r9f3!psql
spring.datasource.driver-class-name=org.postgresql.Driver
# Conexiones: 3 steps x 2 hilos + 3 hilos de flujo + hilo principal + margen (ver README, dimensionamiento)
spring.datasource.hikari.maximum-pool-size=12

# Metadatos de Spring Batch y tablas de negocio (schema-postgresql.sql)
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

spring.batch.job.name=masterJob

# --- Parámetros del proceso (ver XyzBatchProperties y README) ---
# Archivos del dataset oficial fin_legacy_data (semana_3). Se pueden apuntar a otro archivo con file:/ruta.csv
xyz.batch.input.transactions=classpath:data/movimientos_financieros_diarios.csv
xyz.batch.input.interests=classpath:data/intereses_trimestrales.csv
xyz.batch.input.statements=classpath:data/estados_financieros_anuales.csv
# Configuración elegida tras la comparación de rendimiento documentada en el README
xyz.batch.chunk-size=100
xyz.batch.step-threads=2
xyz.batch.skip-limit=1000
xyz.batch.retry-limit=3
xyz.batch.reset-tables=true
# Rango aceptable de edad del titular
xyz.batch.min-age=18
xyz.batch.max-age=99
